# Production overlay — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Before deploying:
#   1. Set APP_KEY and DB credentials via .env or secrets manager
#   2. Place TLS certificates in docker/nginx/ssl/ (fullchain.pem, privkey.pem)
#   3. Update APP_URL and server_name in docker/nginx/default.prod.conf

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: timegrid/app:${APP_VERSION:-latest}
    restart: always
    volumes: !reset
      - public_assets:/var/www/html/public
      - app_storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: warning
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes: !reset
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 128M
        reservations:
          cpus: "0.25"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  mysql:
    restart: always
    ports: !reset []
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_DATABASE:-timegrid}
      MYSQL_USER: ${DB_USERNAME:-timegrid}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    restart: always
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  mailpit:
    profiles:
      - debug

volumes:
  public_assets:
    driver: local
  app_storage:
    driver: local
  nginx_cache:
    driver: local
