name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, sqlite3, gd, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.composer-cache.outputs.dir }}
            vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          mkdir -p database
          touch database/database.sqlite

      - name: Configure PHPUnit for SQLite
        run: |
          sed -i 's/<env name="DB_CONNECTION" value="testing"\/>/<env name="DB_CONNECTION" value="sqlite"\/>/' phpunit.xml
          sed -i 's/<env name="DB_DATABASE" value="testing_timegrid"\/>/<env name="DB_DATABASE" value="database\/database.sqlite"\/>/' phpunit.xml

      - name: Run migrations
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
        run: php artisan migrate --force --no-interaction

      - name: Run tests
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php artisan test

      - name: Run Laravel Pint (code style)
        run: vendor/bin/pint --test

      - name: Composer audit (dependency vulnerabilities)
        run: composer audit --no-ansi

      - name: SAST - Basic security checks
        run: |
          set -euo pipefail

          echo "==> Checking for committed secrets and credentials"
          if git ls-files | grep -E '^\.env$|credentials\.json|\.pem$|id_rsa$' | grep -qv '.env.example'; then
            echo "ERROR: Sensitive files detected in repository"
            git ls-files | grep -E '^\.env$|credentials\.json|\.pem$|id_rsa$' || true
            exit 1
          fi

          echo "==> Scanning for hardcoded secrets in application code"
          if rg -n --glob '*.php' --glob '!vendor/**' \
            -e 'password\s*=\s*['\''"][^'\''"]{8,}['\''"]' \
            -e 'api[_-]?key\s*=\s*['\''"][^'\''"]{8,}['\''"]' \
            app/ config/ routes/ 2>/dev/null; then
            echo "ERROR: Possible hardcoded credentials found"
            exit 1
          fi

          echo "==> Checking for dangerous PHP functions in app code"
          DANGEROUS=$(rg -l --glob '*.php' --glob '!vendor/**' \
            -e '\beval\s*\(' \
            -e '\bexec\s*\(' \
            -e '\bshell_exec\s*\(' \
            -e '\bsystem\s*\(' \
            -e '\bpassthru\s*\(' \
            -e '\bproc_open\s*\(' \
            app/ 2>/dev/null || true)
          if [ -n "$DANGEROUS" ]; then
            echo "ERROR: Dangerous function usage detected:"
            echo "$DANGEROUS"
            exit 1
          fi

          echo "==> Checking for raw SQL with string interpolation"
          if rg -n --glob '*.php' --glob '!vendor/**' \
            -e '(DB::(raw|select|statement|unprepared)\(.*\$_(GET|POST|REQUEST|COOKIE))' \
            -e '(whereRaw|selectRaw|orderByRaw|havingRaw)\(.*\$' \
            app/ 2>/dev/null; then
            echo "WARNING: Potential SQL injection patterns found — review required"
            exit 1
          fi

          echo "==> Verifying debug mode is not forced in config"
          if rg -n "APP_DEBUG.*true" .env.example 2>/dev/null | grep -v '^#' ; then
            echo "NOTE: .env.example has APP_DEBUG=true (acceptable for local dev template)"
          fi

          echo "SAST checks passed"
