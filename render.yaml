services:
  - type: web
    name: original-timegrid
    runtime: docker
    plan: free
    branch: original-timegrid
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://original-timegrid.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: CACHE_DRIVER
        value: array
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_DRIVER
        value: sync
      - key: LOG_CHANNEL
        value: errorlog
